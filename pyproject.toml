[project]
name = "pid-motor-sim"
version = "1.0.0"
description = "Discrete PID position control of a DC motor with saturation, anti-windup, and an interactive tuner"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# matplotlib on Python 3.9 triggers deprecation notices inside the pyparsing library; they are not from this code
filterwarnings = ["ignore:.*deprecated - use:DeprecationWarning"]
